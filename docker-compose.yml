# Start Postgres + Ollama from the repo root: npm run dev:deps
# One-shot real stack + API: npm run dev:stack -w @ai-sql-assistant/backend
# No DB: npm run dev:stub -w @ai-sql-assistant/backend

# Keep the project name from when this file lived in the backend repo, so the
# existing postgres_data / ollama_data volumes are reused.
name: ai-sql-assistant-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-sql-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_sql_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_sql_assistant"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
  ollama:
    image: ollama/ollama:latest
    container_name: ai-sql-assistant-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
